<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">EvalForge asynchronous evaluation architecture</title>
  <desc id="description">The Next.js interface calls FastAPI, which stores state in PostgreSQL and queues work through Redis. A Dramatiq worker executes mock agents and evaluators, then persists task results and aggregates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b16"/><stop offset="1" stop-color="#1c3026"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#07100b" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9f36b"/></marker>
  </defs>
  <rect width="1440" height="900" rx="32" fill="url(#background)"/>
  <text x="88" y="94" fill="#c9f36b" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="3">EVALFORGE V1</text>
  <text x="88" y="150" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="750">Asynchronous evaluation pipeline</text>
  <text x="88" y="188" fill="#aebdb4" font-family="Inter,system-ui,sans-serif" font-size="18">Durable state, deterministic execution, inspectable evaluator evidence</text>
  <g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
    <g transform="translate(88 286)"><rect width="240" height="168" rx="20" fill="#f8faf7"/><text x="24" y="38" fill="#176b45" font-size="13" font-weight="700" letter-spacing="2">PRODUCT</text><text x="24" y="78" fill="#18221d" font-size="25" font-weight="750">Next.js web</text><text x="24" y="112" fill="#657169" font-size="15">Benchmarks · runs</text><text x="24" y="137" fill="#657169" font-size="15">agents · analytics</text></g>
    <g transform="translate(424 286)"><rect width="240" height="168" rx="20" fill="#f8faf7"/><text x="24" y="38" fill="#176b45" font-size="13" font-weight="700" letter-spacing="2">CONTROL PLANE</text><text x="24" y="78" fill="#18221d" font-size="25" font-weight="750">FastAPI</text><text x="24" y="112" fill="#657169" font-size="15">Validation · state</text><text x="24" y="137" fill="#657169" font-size="15">queue dispatch</text></g>
    <g transform="translate(760 250)"><rect width="240" height="132" rx="20" fill="#eaf3ec"/><text x="24" y="38" fill="#176b45" font-size="13" font-weight="700" letter-spacing="2">DURABLE STATE</text><text x="24" y="78" fill="#18221d" font-size="25" font-weight="750">PostgreSQL</text><text x="24" y="107" fill="#657169" font-size="15">Runs · events · scores</text></g>
    <g transform="translate(760 418)"><rect width="240" height="132" rx="20" fill="#eef5df"/><text x="24" y="38" fill="#176b45" font-size="13" font-weight="700" letter-spacing="2">QUEUE</text><text x="24" y="78" fill="#18221d" font-size="25" font-weight="750">Redis</text><text x="24" y="107" fill="#657169" font-size="15">Dramatiq messages</text></g>
    <g transform="translate(1096 286)"><rect width="256" height="264" rx="20" fill="#c9f36b"/><text x="24" y="38" fill="#365424" font-size="13" font-weight="700" letter-spacing="2">EXECUTION PLANE</text><text x="24" y="78" fill="#18221d" font-size="25" font-weight="750">Worker</text><text x="24" y="119" fill="#365424" font-size="15">1. Claim run atomically</text><text x="24" y="151" fill="#365424" font-size="15">2. Execute mock agent</text><text x="24" y="183" fill="#365424" font-size="15">3. Apply evaluators</text><text x="24" y="215" fill="#365424" font-size="15">4. Persist aggregates</text></g>
  </g>
  <g stroke="#c9f36b" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M328 370h84"/><path d="M664 332h84"/><path d="M664 408c54 0 42 76 84 76"/><path d="M1000 484h84"/><path d="M1096 334h-84"/></g>
  <g transform="translate(88 658)" font-family="Inter,system-ui,sans-serif"><rect width="1264" height="144" rx="20" fill="#ffffff0d" stroke="#ffffff1f"/><text x="28" y="40" fill="#c9f36b" font-size="13" font-weight="700" letter-spacing="2">RELIABILITY BOUNDARIES</text><text x="28" y="82" fill="#ffffff" font-size="18" font-weight="650">Atomic run claim</text><text x="250" y="82" fill="#ffffff" font-size="18" font-weight="650">Retry cleanup</text><text x="444" y="82" fill="#ffffff" font-size="18" font-weight="650">Unique attempts</text><text x="654" y="82" fill="#ffffff" font-size="18" font-weight="650">Weighted scoring</text><text x="875" y="82" fill="#ffffff" font-size="18" font-weight="650">Simplified pass@k</text><text x="1098" y="82" fill="#ffffff" font-size="18" font-weight="650">Event timeline</text><text x="28" y="112" fill="#9eaea4" font-size="14">Queued → Running</text><text x="250" y="112" fill="#9eaea4" font-size="14">Partial attempts reset</text><text x="444" y="112" fill="#9eaea4" font-size="14">Task + attempt constraint</text><text x="654" y="112" fill="#9eaea4" font-size="14">Reason + metadata</text><text x="875" y="112" fill="#9eaea4" font-size="14">First success within k</text><text x="1098" y="112" fill="#9eaea4" font-size="14">Ordered evidence</text></g>
</svg>
